name: Build Android debug APK

# Builds a real, installable debug APK of the client app on GitHub's own
# runners (which have full internet access, unlike a sandboxed AI
# environment) so it can be downloaded and installed on any Android phone
# for a genuine visual check against the Figma design. Debug-signed only —
# not for the Play Store.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-ci.log

      - name: Report failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 250 build-ci.log > /tmp/fail.txt || echo "no log" > /tmp/fail.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat /tmp/fail.txt)"

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find composeApp/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-on-top-client-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
