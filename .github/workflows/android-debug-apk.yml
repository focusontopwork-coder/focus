name: Build Android debug APK

# Builds a real, installable debug APK of the client app on GitHub's own
# runners (which have full internet access, unlike a sandboxed AI
# environment) so it can be downloaded and installed on any Android phone
# for a genuine visual check against the Figma design. Debug-signed only —
# not for the Play Store.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-ci.log

      # The raw Actions job log lives on Azure Blob Storage, which the AI
      # sandbox that set this workflow up cannot reach (network allowlist),
      # so on failure the log is pushed to its own throwaway git branch
      # instead — a plain git fetch of that branch works everywhere.
      - name: Push failure log to a branch (git log fetch works everywhere)
        if: failure()
        run: |
          mkdir -p /tmp/ci-log-worktree
          cd /tmp/ci-log-worktree
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b ci-log-${{ github.run_id }}
          cp "$GITHUB_WORKSPACE/build-ci.log" ./build-ci.log 2>/dev/null || echo "no build-ci.log produced" > ./build-ci.log
          git add build-ci.log
          git commit -q -m "CI log for run ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin "ci-log-${{ github.run_id }}"

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find composeApp/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-on-top-client-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
